<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Erika Contreras — Full Stack Developer and Tech Lead" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="960" height="260" rx="18" fill="url(#bg)"/>
  <rect width="960" height="260" rx="18" fill="url(#grid)"/>

  <!-- decorative nodes -->
  <g fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.55">
    <path d="M700 60 L770 100 L840 70 L890 130 L820 180 L750 160 L770 100"/>
    <path d="M750 160 L700 200 M840 70 L880 40"/>
  </g>
  <g fill="#5eead4">
    <circle cx="700" cy="60" r="5"/><circle cx="770" cy="100" r="7"/>
    <circle cx="840" cy="70" r="5"/><circle cx="890" cy="130" r="6"/>
    <circle cx="820" cy="180" r="5"/><circle cx="750" cy="160" r="6"/>
    <circle cx="700" cy="200" r="4"/><circle cx="880" cy="40" r="4"/>
  </g>
  <circle cx="770" cy="100" r="7" fill="none" stroke="#5eead4">
    <animate attributeName="r" values="7;20" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="78" font-size="16" fill="#5eead4">erika@bogota:~$ ./hello.sh</text>
    <text x="56" y="136" font-size="46" font-weight="700" fill="#f8fafc">Erika Contreras</text>
    <rect x="56" y="156" width="150" height="4" rx="2" fill="url(#accent)"/>
    <text x="56" y="196" font-size="19" fill="#cbd5e1">Full Stack Developer · Tech Lead</text>
    <text x="56" y="226" font-size="14" fill="#94a3b8">Vue · React · NestJS · Laravel · n8n + AI automation</text>
  </g>
</svg>
